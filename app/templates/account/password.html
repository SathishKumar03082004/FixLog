{% extends "base.html" %}
{% block title %}Change password · FixLog{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="panel">
    <p class="eyebrow mb-1">ACCOUNT</p>
    <h1 class="h3 fw-bold mb-3">Change password</h1>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label fw-semibold" for="current_password">Current password</label><input class="form-control" id="current_password" name="current_password" type="password" required></div>
      <div class="mb-3"><label class="form-label fw-semibold" for="new_password">New password</label><input class="form-control" id="new_password" name="new_password" type="password" minlength="8" required></div>
      <div class="mb-3"><label class="form-label fw-semibold" for="confirm_password">Confirm new password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required></div>
      <div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Update password</button><a class="btn btn-outline-secondary" href="/dashboard">Cancel</a></div>
    </form>
  </div>
</div>
{% endblock %}
