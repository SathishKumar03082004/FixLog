<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FixLog{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">FixLog <span class="brand-dot">.</span></a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link" href="/">Dashboard</a>
      <a class="nav-link" href="/issues">All Issues</a>
      <a class="btn btn-sm btn-light fw-semibold" href="/issues/new">+ New Issue</a>
    </div>
  </div>
</nav>
<main class="container py-4 py-md-5">
  {% block content %}{% endblock %}
</main>
<footer class="container pb-4 text-center text-secondary small">FixLog · Keep the fix, not just the error.</footer>
</body>
</html>
